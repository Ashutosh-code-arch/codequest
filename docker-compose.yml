services:
  postgres:
    image: postgres:15-alpine
    container_name: codequest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codequest_code
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: localpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
