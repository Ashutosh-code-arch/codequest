name: CI / Deploy

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    typecheck:
        name: TypeScript check
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22" # ✅ updated (Node 20 deprecated)
                  cache: "npm"
                  cache-dependency-path: |
                      backend/package-lock.json
                      frontend/package-lock.json
            - name: Show Node + TS version
              run: |
                  node -v
                  npx tsc -v || echo "TS not installed yet"

            # BACKEND
            - name: Install backend deps
              working-directory: ./backend
              run: npm ci
            - name: Typecheck backend
              working-directory: ./backend
              run: npx tsc --noEmit --pretty false -p tsconfig.json
            - name: Debug backend config
              working-directory: ./backend
              run: npx tsc --showConfig
            - name: List backend files checked
              working-directory: ./backend
              run: npx tsc --noEmit --listFiles

            # FRONTEND
            - name: Install frontend deps
              working-directory: ./frontend
              run: npm ci

            - name: Typecheck frontend
              working-directory: ./frontend
              run: npx tsc -b tsconfig.app.json
            - name: Debug frontend config
              working-directory: ./frontend
              run: npx tsc --showConfig

            - name: List frontend files checked
              working-directory: ./frontend
              run: npx tsc --noEmit --listFiles

    deploy-backend:
        name: Deploy to Render
        needs: typecheck
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest

        steps:
            - name: Trigger Render deploy hook
              run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

    deploy-frontend:
        name: Deploy to Vercel
        needs: typecheck
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Install Vercel CLI
              run: npm install -g vercel
            - name: Deploy
              working-directory: ./frontend
              run: vercel ./frontend --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
