name: CI / Deploy

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    typecheck:
        name: TypeScript check
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: |
                      backend/package-lock.json
                      frontend/package-lock.json
            - name: Show runtime versions
              run: |
                  node --version
                  npm --version

            # BACKEND
            - name: Install backend deps
              working-directory: ./backend
              run: npm ci
            - name: Typecheck backend
              working-directory: ./backend
              run: npm run typecheck
            - name: Test backend
              working-directory: ./backend
              run: npm test

            # FRONTEND
            - name: Install frontend deps
              working-directory: ./frontend
              run: npm ci

            - name: Typecheck frontend
              working-directory: ./frontend
              run: npm run typecheck
            - name: Lint frontend
              working-directory: ./frontend
              run: npm run lint
            - name: Build frontend
              working-directory: ./frontend
              run: npm run build

    deploy-backend:
        name: Deploy to Render
        needs: typecheck
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest

        steps:
            - name: Trigger Render deploy hook
              run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

    deploy-frontend:
        name: Deploy to Vercel
        needs: typecheck
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: "24"
            - name: Install Vercel CLI
              run: npm install --global vercel@59.1.3
            - name: Validate Vercel credentials
              run: |
                  if [[ -z "$VERCEL_TOKEN" ]]; then
                      echo "::error::The VERCEL_TOKEN GitHub Actions secret is missing."
                      exit 1
                  fi
                  if [[ -z "$VERCEL_ORG_ID" ]]; then
                      echo "::error::The VERCEL_ORG_ID GitHub Actions secret is missing."
                      exit 1
                  fi
                  if [[ -z "$VERCEL_PROJECT_ID" ]]; then
                      echo "::error::The VERCEL_PROJECT_ID GitHub Actions secret is missing."
                      exit 1
                  fi
            - name: Pull Vercel production configuration
              working-directory: ./frontend
              run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            - name: Build Vercel artifacts
              working-directory: ./frontend
              run: vercel build --prod --token="$VERCEL_TOKEN"
            - name: Deploy Vercel artifacts
              working-directory: ./frontend
              run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
